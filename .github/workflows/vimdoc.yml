name: Generate docs

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - news.md
      - docs/**
      - scripts/generate-docs.lua
      - lua/easy-dotnet/commands.lua
      - lua/easy-dotnet/options.lua
      - lua/easy-dotnet/highlights.lua
      - lua/easy-dotnet/init.lua
      - .github/workflows/vimdoc.yml
  pull_request:
    paths:
      - README.md
      - news.md
      - docs/**
      - scripts/generate-docs.lua
      - lua/easy-dotnet/commands.lua
      - lua/easy-dotnet/options.lua
      - lua/easy-dotnet/highlights.lua
      - lua/easy-dotnet/init.lua
      - .github/workflows/vimdoc.yml

permissions:
  contents: write

concurrency:
  group: vimdoc-${{ github.ref }}
  cancel-in-progress: true

jobs:

  vimdoc:
    name: vimdoc
    runs-on: ubuntu-latest
    steps:

      # On PRs, check out the branch itself (not the merge commit) so the generated docs can be pushed to it
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: stable

      # docs/commands.md and docs/configuration.md are generated from the plugin source
      - run: nvim --headless --clean -l scripts/generate-docs.lua

      - uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: easy-dotnet
          pandoc: README.md
          version: "Neovim >= 0.11.0"
          demojify: true
          # README has its own "Table of Contents" heading; a generated one would duplicate its tag
          toc: false

      # The docs pages start with a "# Title"; shifting makes it the document title instead of
      # a parent heading, which would otherwise be prepended to every tag
      - uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: easy-dotnet-commands
          pandoc: docs/commands.md
          version: "Neovim >= 0.11.0"
          demojify: true
          shiftheadinglevelby: -1

      - uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: easy-dotnet-configuration
          pandoc: docs/configuration.md
          version: "Neovim >= 0.11.0"
          demojify: true
          shiftheadinglevelby: -1

      - uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: easy-dotnet-lsp
          pandoc: docs/lsp.md
          version: "Neovim >= 0.11.0"
          demojify: true
          shiftheadinglevelby: -1

      - uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: easy-dotnet-debugging
          pandoc: docs/debugging.md
          version: "Neovim >= 0.11.0"
          demojify: true
          shiftheadinglevelby: -1

      - uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: easy-dotnet-advanced-patterns
          pandoc: docs/advanced-patterns.md
          version: "Neovim >= 0.11.0"
          demojify: true
          shiftheadinglevelby: -1

      - uses: kdheepak/panvimdoc@v6.0.0
        with:
          vimdoc: easy-dotnet-news
          pandoc: news.md
          version: "Neovim >= 0.11.0"
          demojify: true
          shiftheadinglevelby: -1

      # panvimdoc drops the space before a tag when heading + tag exceed the line width,
      # and Vim does not register a tag that is not preceded by whitespace
      - run: sed -i -E 's/([^ ])(\*[^* ]+\*)$/\1 \2/' doc/*.txt

      # Fork PRs only verify the generation; their branches can't be pushed to
      - uses: stefanzweifel/git-auto-commit-action@v7
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          commit_message: "chore(docs): auto-generate docs"
          file_pattern: doc/*.txt docs/commands.md docs/configuration.md
